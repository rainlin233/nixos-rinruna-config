# Umbriel Material You 动态色板（由 Noctalia 按壁纸色板渲染）
# 输出到 ~/.config/umbriel/colors.toml，由 config.toml 的 [include] 引入。
#
# 这些键不只影响 Umbriel 自己的 UI（cheatsheet / overview / 对话框），
# 也通过 IPC 驱动 xdg-desktop-portal-umbriel 的共享选择器配色。

[colors]
background = "{{ colors.surface_container.default.hex }}"
text_primary = "{{ colors.on_surface.default.hex }}"
text_muted = "{{ colors.on_surface_variant.default.hex }}"
accent_primary = "{{ colors.primary.default.hex }}"
accent_secondary = "{{ colors.secondary.default.hex }}"
warning = "{{ colors.tertiary.default.hex }}"
error = "{{ colors.error.default.hex }}"
insert_hint = "{{ colors.primary.default.hex }}80"
backdrop = "{{ colors.surface.default.hex }}"
shadow = "{{ colors.primary.default.hex }}95"

[colors.border]
focused = "{{ colors.primary.default.hex }}FF"
unfocused = "#00000000"
outer = "#00000000"

[colors.tab_bar]
active = "{{ colors.primary.default.hex }}FF"
urgent = "{{ colors.error.default.hex }}FF"

[colors.overview]
background_tint = "#4c566a90"
badge = "{{ colors.primary.default.hex }}FF"
