[colors.border]
focused = "#923c1cFF"
unfocused = "#00000000"
outer = "#00000000"

[colors.tab_bar]
active = "#923c1cFF"
urgent = "#ba1a1aFF"

[colors.overview]
background_tint = "#4c566a90"
badge = "#923c1cFF"
