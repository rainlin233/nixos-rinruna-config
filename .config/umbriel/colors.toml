# Umbriel Material You 动态色板（由 Noctalia 按壁纸色板渲染）
# 输出到 ~/.config/umbriel/colors.toml，由 config.toml 的 [include] 引入。
#
# 这些键不只影响 Umbriel 自己的 UI（cheatsheet / overview / 对话框），
# 也通过 IPC 驱动 xdg-desktop-portal-umbriel 的共享选择器配色。

[colors]
background = "#f0edef"
text_primary = "#1c1b1d"
text_muted = "#46464c"
accent_primary = "#272b3e"
accent_secondary = "#5d5e67"
warning = "#3a2533"
error = "#ba1a1a"
insert_hint = "#272b3e80"
backdrop = "#fcf8fa"
shadow = "#272b3e95"

[colors.border]
focused = "#272b3eFF"
unfocused = "#00000000"
outer = "#00000000"

[colors.tab_bar]
active = "#272b3eFF"
urgent = "#ba1a1aFF"

[colors.overview]
background_tint = "#4c566a90"
badge = "#272b3eFF"
