# Umbriel Material You 动态色板（由 Noctalia 按壁纸色板渲染）
# 输出到 ~/.config/umbriel/colors.toml，由 config.toml 的 [include] 引入。
#
# 这些键不只影响 Umbriel 自己的 UI（cheatsheet / overview / 对话框），
# 也通过 IPC 驱动 xdg-desktop-portal-umbriel 的共享选择器配色。

[colors]
background = "#f2eedc"
text_primary = "#1c1c11"
text_muted = "#484833"
accent_primary = "#626200"
accent_secondary = "#61611f"
warning = "#506600"
error = "#ba1a1a"
insert_hint = "#62620080"
backdrop = "#fdfae7"
shadow = "#62620095"

[colors.border]
focused = "#626200FF"
unfocused = "#00000000"
outer = "#00000000"

[colors.tab_bar]
active = "#626200FF"
urgent = "#ba1a1aFF"

[colors.overview]
background_tint = "#4c566a90"
badge = "#626200FF"
