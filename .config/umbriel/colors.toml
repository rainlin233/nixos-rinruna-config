# Umbriel Material You 动态色板（由 Noctalia 按壁纸色板渲染）
# 输出到 ~/.config/umbriel/colors.toml，由 config.toml 的 [include] 引入。
#
# 这些键不只影响 Umbriel 自己的 UI（cheatsheet / overview / 对话框），
# 也通过 IPC 驱动 xdg-desktop-portal-umbriel 的共享选择器配色。

[colors]
background = "#f0edf2"
text_primary = "#1b1b1f"
text_muted = "#46464f"
accent_primary = "#3a3b75"
accent_secondary = "#5c5c75"
warning = "#632f57"
error = "#ba1a1a"
insert_hint = "#3a3b7580"
backdrop = "#fcf8fe"
shadow = "#3a3b7595"

[colors.border]
focused = "#3a3b75FF"
unfocused = "#00000000"
outer = "#00000000"

[colors.tab_bar]
active = "#3a3b75FF"
urgent = "#ba1a1aFF"

[colors.overview]
background_tint = "#4c566a90"
badge = "#3a3b75FF"
