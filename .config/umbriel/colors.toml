# Umbriel Material You 动态色板（由 Noctalia 按壁纸色板渲染）
# 输出到 ~/.config/umbriel/colors.toml，由 config.toml 的 [include] 引入。
#
# 这些键不只影响 Umbriel 自己的 UI（cheatsheet / overview / 对话框），
# 也通过 IPC 驱动 xdg-desktop-portal-umbriel 的共享选择器配色。

[colors]
background = "#fdeae4"
text_primary = "#231916"
text_muted = "#56423c"
accent_primary = "#923c1c"
accent_secondary = "#825242"
warning = "#6b5f00"
error = "#ba1a1a"
insert_hint = "#923c1c80"
backdrop = "#fff8f6"
shadow = "#923c1c95"

[colors.border]
focused = "#923c1cFF"
unfocused = "#00000000"
outer = "#00000000"

[colors.tab_bar]
active = "#923c1cFF"
urgent = "#ba1a1aFF"

[colors.overview]
background_tint = "#4c566a90"
badge = "#923c1cFF"
