# Umbriel Material You 动态色板（由 Noctalia 按壁纸色板渲染）
# 输出到 ~/.config/umbriel/colors.toml，由 config.toml 的 [include] 引入。
#
# 这些键不只影响 Umbriel 自己的 UI（cheatsheet / overview / 对话框），
# 也通过 IPC 驱动 xdg-desktop-portal-umbriel 的共享选择器配色。

[colors]
background = "#eeedf0"
text_primary = "#1a1c1e"
text_muted = "#43474d"
accent_primary = "#00223d"
accent_secondary = "#545f6d"
warning = "#311637"
error = "#ba1a1a"
insert_hint = "#00223d80"
backdrop = "#faf9fc"
shadow = "#00223d95"

[colors.border]
focused = "#00223dFF"
unfocused = "#00000000"
outer = "#00000000"

[colors.tab_bar]
active = "#00223dFF"
urgent = "#ba1a1aFF"

[colors.overview]
background_tint = "#4c566a90"
badge = "#00223dFF"
